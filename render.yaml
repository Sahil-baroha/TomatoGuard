services:
  - type: web
    name: tomatoguard-api
    env: docker
    region: oregon
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
